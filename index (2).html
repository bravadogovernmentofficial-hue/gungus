<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Press me!</title>
<style>
  :root {
    --bg: #f2efe6;
    --ink: #1c1b3a;
    --btn: #ff3d71;
    --btn-shadow: #1c1b3a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14132b; --ink: #f2efe6; --btn-shadow: #f2efe6; }
  }
  :root[data-theme="dark"] { --bg: #14132b; --ink: #f2efe6; --btn-shadow: #f2efe6; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    font-family: "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  #press {
    font: inherit;
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 800;
    color: #fff;
    background: var(--btn);
    border: 4px solid var(--btn-shadow);
    border-radius: 999px;
    padding: 0.5em 1.4em;
    cursor: pointer;
    box-shadow: 0 8px 0 var(--btn-shadow);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  #press:active { transform: translateY(8px); box-shadow: 0 0 0 var(--btn-shadow); }
  #press:focus-visible { outline: 4px solid var(--ink); outline-offset: 6px; }
  #stage { display: none; position: fixed; inset: 0; background: #000; }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  body.playing #stage { display: block; }
  body.playing #press { display: none; }
</style>
</head>
<body>
  <button id="press" type="button">press me!</button>
  <div id="stage"></div>

<script>
  var VIDEO_ID = "DXpdr0qca_Y";
  var stage = document.getElementById("stage");

  function goFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) {
      try {
        var p = fn.call(el);
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }
  }

  document.getElementById("press").addEventListener("click", function () {
    goFullscreen();
    document.body.classList.add("playing");
    stage.innerHTML =
      '<iframe src="https://www.youtube.com/embed/' + VIDEO_ID +
      '?autoplay=1&rel=0&playsinline=1" title="Video" ' +
      'allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  });

  document.addEventListener("fullscreenchange", function () {
    if (!document.fullscreenElement && document.body.classList.contains("playing")) {
      stage.innerHTML = "";
      document.body.classList.remove("playing");
    }
  });
</script>
</body>
</html>
